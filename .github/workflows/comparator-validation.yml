name: Comparator branch validation
on:
  push:
    branches:
      - validation/comparator-accepted-statements
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install and verify real bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          # Permit unprivileged namespaces on this disposable test runner.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test "$(id -u)" -ne 0
          /usr/bin/bwrap --version
          /usr/bin/bwrap --ro-bind / / --unshare-all -- /bin/true
      - name: Install matching Lean nightly
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl_bin="$(command -v curl)"
          tar_bin="$(command -v tar)"
          test -f "$curl_bin"
          test -f "$tar_bin"
          "$curl_bin" -fL --retry 3 https://github.com/leanprover/lean4-nightly/releases/download/nightly-2026-10-19/lean-4.37.0-nightly-2026-10-19-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          "$tar_bin" --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          bin="$RUNNER_TEMP/lean-4.37.0-nightly-2026-10-19-linux/bin"
          test -x "$bin/lake"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Build Lake from the tested sources
        working-directory: tests/lake
        run: ${{ steps.toolchain.outputs.bin }}/lake build --wfail
      - name: Check feature modules with core compiler linters
        working-directory: tests/lake
        shell: bash
        run: |
          set -euo pipefail
          test -x "${{ steps.toolchain.outputs.bin }}/lean"
          for source in ../../src/lake/Lake/Check/Compare.lean ../../src/lake/Lake/CLI/Check.lean ../../src/lake/Lake/CLI/Help.lean; do
            "${{ steps.toolchain.outputs.bin }}/lake" env "${{ steps.toolchain.outputs.bin }}/lean" --root=../../src/lake -Dlinter.coreInternal=true -Dlinter.redundantVisibility=true -DwarningAsError=true -Dinterpreter.prefer_native=false "$source"
            echo "Core compiler linters passed: $source"
          done
      - name: Test evaluator isolation with the real sandbox
        shell: bash
        run: |
          set -euo pipefail
          export LAKE="$PWD/tests/lake/.lake/build/bin/lake"
          export COMPARATOR_REQUIRE_SANDBOX_TESTS=1
          tests/lake/run_test.sh tests/comparator-evaluator-isolation
      - name: Run Comparator and checker regression suites
        shell: bash
        run: |
          set -euo pipefail
          export LAKE="$PWD/tests/lake/.lake/build/bin/lake"
          for test in tests/lake/tests/challenge-* tests/lake/tests/check-* tests/lake/tests/comparator-*; do
            if [ "$test" = tests/lake/tests/comparator-evaluator-isolation ]; then continue; fi
            echo "::group::$test"
            tests/lake/run_test.sh "${test#tests/lake/}"
            echo "::endgroup::"
          done
